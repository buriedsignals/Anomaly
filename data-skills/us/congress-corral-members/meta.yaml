notes: >-
  Checked with Firecrawl on 2026-10-27. The raw HTML of
  https://localsearchamerica.com/cc/ fetches the published Google Sheets CSV
  in `endpoint` and parses it with a naive comma splitter.
  https://congresscorral.com showed the same app with "Showing 538 of 538
  legislators" and filters for chamber, party, state, religion, and
  occupation. Column names are inferred from the page script, not from the
  CSV: full_name, type, state, district, party, gender, birthday, religion,
  occupation, short_description, url, address, phone, contact_form,
  bioguide_id, govtrack_id, opensecrets_id, votesmart_id, fec_ids, cspan_id,
  wikipedia_id, ballotpedia_id, twitter, facebook, youtube, youtube_rss,
  mastodon, reddit_topic_id, image. The CSV itself could not be fetched
  through Firecrawl (anti-bot refusal). No maintainer, source, update date,
  or licence is stated on either page.

