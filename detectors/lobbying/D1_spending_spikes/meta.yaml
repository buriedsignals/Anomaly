source_columns: [registrant_id, registrant_name, filing_year, filing_period, total_income, prior_mean, prior_sd, prior_n, z_score]
description: A registrant's disclosed spend in one period jumps against its previous four periods (z-score).
required_tables: [lobbying_registrations]
required_fields: [id]
parameters:
  min_spend: 50000
  min_z_abs: 2.0
  limit: 200
parameter_bounds:
  min_spend: {type: number, minimum: 0, maximum: 1000000000}
  min_z_abs: {type: number, minimum: 0.0, maximum: 1000.0}
  limit: {type: integer, minimum: 1, maximum: 1000}
signal_category: lobbying
severity: medium
expected_output: [register, registrant_id, registrant_name, period_start, total_spend, prior_mean, prior_sd, prior_n, z_score]
assumptions:
  - Generic. Runs on any lobbying register that fills the columns it reads (see the source's SKILL.md column mapping).
  - One spend value is kept per registrant, client and period (the highest), so amendments do not double count.
  - Spend is the midpoint of spend_low and spend_high; registers that publish annual ranges (EU) give coarse values.
false_positives:
  - A registrant that gains a large client or changes its reporting method spikes legitimately.
  - Registers without money columns produce no rows.
sensitive_output: redact
resource_limits: {timeout_seconds: 5, memory_mb: 256}
