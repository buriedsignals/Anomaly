severity: medium
expected_output: [register, registrant_id, registrant_name, reports_without_spend, distinct_clients, first_seen, last_seen]
assumptions:
  - Generic. Runs on any lobbying register that fills the columns it reads (see the source's SKILL.md column mapping).
  - A filing type counts as money-bearing when any row of that type in the same register discloses spend.
false_positives:
  - Some registers allow no amount below a threshold (LDA reports under 5,000 dollars carry none).
  - Registers that never publish money produce no rows.
