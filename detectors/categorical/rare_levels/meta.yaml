id: categorical.rare_levels
version: 1.0.0
title: Rare categorical levels
author: anomaly
license: internal
group: categorical
description: Finds categorical values with unusually low frequency.
query: query.sql
required_tables:
  - "*"
required_fields:
  - group
required_types:
  group:
    - text
minimum_coverage:
  group: 0.75
relevance: 0.8
utility: 0.7
cost: 0.2
false_positive_risk: 0.1
parameters:
  maximum_fraction: 0.05
sensitive_output: redact
signal_category: anomaly
severity: medium
expected_output: [candidate_id]
assumptions: [categories are comparable]
false_positives: [legitimate rare categories]
resource_limits: {timeout_seconds: 5, memory_mb: 64, max_output_rows: 100}
