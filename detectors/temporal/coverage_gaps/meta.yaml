id: temporal.coverage_gaps
version: 1.0.0
title: Temporal coverage gaps
author: anomaly
license: internal
group: temporal
description: Finds gaps in an ordered temporal observation series.
query: query.sql
required_tables:
  - "*"
required_fields:
  - id
  - observed_at
required_types:
  id:
    - integer
    - text
  observed_at:
    - datetime
minimum_coverage:
  id: 0.75
  observed_at: 0.75
relevance: 0.8
utility: 0.7
cost: 0.2
false_positive_risk: 0.1
parameters:
  maximum_gap_days: 1
sensitive_output: redact
signal_category: anomaly
severity: medium
expected_output: [candidate_id]
assumptions: [observed_at is a comparable timestamp]
false_positives: [planned collection gaps]
resource_limits: {timeout_seconds: 5, memory_mb: 64, max_output_rows: 100}
